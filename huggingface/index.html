<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A browser-only exploration of labeled PII categories in a public Hugging Face dataset snapshot.">
  <title>AI: Personal or &quot;Personal&quot; data</title>
  <style>
    :root { --ink:#101828; --muted:#475467; --paper:#f8fafc; --card:#fff; --line:#d0d5dd; --blue:#1d4ed8; --violet:#6d28d9; --amber:#92400e; --green:#047857; --rose:#b42318; --retained:#2563eb; --forgot:#7c3aed; --shadow:0 14px 34px rgba(16,24,40,.08); }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; color:var(--ink); background:linear-gradient(135deg,#eff6ff 0%,#f8fafc 46%,#f5f3ff 100%); font:16px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,select { font:inherit; }
    button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible { outline:3px solid #93c5fd; outline-offset:3px; }
    a { color:#1d4ed8; }
    .skip { position:absolute; left:-999px; top:auto; width:1px; height:1px; overflow:hidden; }
    .skip:focus { left:1rem; top:1rem; width:auto; height:auto; padding:.65rem .85rem; background:#111827; color:#fff; border-radius:.5rem; z-index:20; }
    header { padding:3.5rem 1.25rem 2.4rem; background:radial-gradient(circle at 82% 10%,rgba(147,197,253,.75),transparent 30%),linear-gradient(115deg,#111827,#1e3a8a 70%,#4338ca); color:#fff; }
    .wrap { width:min(1180px,100%); margin:auto; }
    .eyebrow { margin:0 0 .6rem; font-size:.78rem; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:#bfdbfe; }
    h1 { max-width:850px; margin:0; font-size:clamp(2rem,5vw,4.25rem); line-height:1.03; letter-spacing:-.045em; }
    .lede { max-width:820px; margin:1rem 0 0; color:#dbeafe; font-size:clamp(1rem,2vw,1.2rem); }
    .status { display:inline-flex; gap:.5rem; align-items:center; margin-top:1.35rem; padding:.45rem .7rem; border:1px solid rgba(255,255,255,.32); border-radius:999px; color:#e0f2fe; background:rgba(255,255,255,.1); font-size:.9rem; }
    .dot { width:.65rem; height:.65rem; border-radius:50%; background:#34d399; box-shadow:0 0 0 4px rgba(52,211,153,.16); }
    main { padding:1.25rem 1.25rem 3rem; }
    .notice { margin:1.2rem 0; padding:1rem 1.1rem; border-left:4px solid #d97706; border-radius:.75rem; background:#fffbeb; color:#78350f; }
    .grid { display:grid; gap:1rem; }
    .metrics { grid-template-columns:repeat(4,minmax(0,1fr)); margin:1.2rem 0; }
    .card { background:var(--card); border:1px solid #e4e7ec; border-radius:1rem; box-shadow:var(--shadow); }
    .metric { padding:1.1rem; }
    .metric p { margin:0; color:var(--muted); font-size:.86rem; }
    .metric strong { display:block; margin-top:.3rem; font-size:2rem; letter-spacing:-.04em; }
    .layout { grid-template-columns:1.4fr .9fr; align-items:start; }
    .panel { padding:1.25rem; }
    h2 { margin:0; font-size:1.25rem; letter-spacing:-.025em; }
    .sub { margin:.35rem 0 1rem; color:var(--muted); font-size:.93rem; }
    .controls { display:flex; flex-wrap:wrap; gap:.7rem; align-items:end; margin-bottom:1rem; }
    label { display:grid; gap:.28rem; color:#344054; font-size:.82rem; font-weight:700; }
    select { min-width:145px; padding:.56rem .65rem; color:var(--ink); border:1px solid var(--line); border-radius:.55rem; background:#fff; }
    .chart { display:grid; gap:.75rem; }
    .bar-row { display:grid; grid-template-columns:minmax(105px,1fr) minmax(140px,3.4fr) 62px; gap:.65rem; align-items:center; }
    .bar-label { font-size:.9rem; overflow-wrap:anywhere; }
    .track { height:1.2rem; overflow:hidden; border-radius:999px; background:#eaf0f6; }
    .bar { height:100%; min-width:2px; border-radius:999px; background:linear-gradient(90deg,var(--blue),var(--violet)); transition:width .35s ease; }
    .value { text-align:right; font-variant-numeric:tabular-nums; font-weight:800; }
    .legend { display:flex; flex-wrap:wrap; gap:.8rem; padding-top:1rem; color:var(--muted); font-size:.85rem; }
    .key { display:inline-flex; gap:.35rem; align-items:center; }
    .swatch { width:.75rem; height:.75rem; border-radius:3px; background:var(--blue); }
    .swatch.retained { background:var(--retained); }
    .swatch.forgot { background:var(--forgot); }
    .comparison { margin-top:1.25rem; }
    /* Original embedded PII stacked-bar chart */
    .comparison-chart { display:grid; gap:.8rem; }
    .comparison-row { display:grid; grid-template-columns:minmax(105px,1fr) minmax(140px,3.4fr) 100px; gap:.65rem; align-items:center; }
    .stack-track { display:flex; height:1.3rem; overflow:hidden; border-radius:999px; background:#eaf0f6; }
    .stack { height:100%; min-width:0; transition:width .35s ease; }
    .stack.retained { background:var(--retained); }
    .stack.forgot { background:var(--forgot); }
    .comparison-value { text-align:right; color:var(--muted); font-size:.8rem; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .comparison-section { margin-top:1.25rem; }
    .section-heading { margin-bottom:1rem; }
    .section-description { max-width:850px; margin:.35rem 0 0; color:var(--muted); }
    .comparison-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1rem; margin-bottom:1rem; }
    .comparison-card { padding:1rem 1.1rem; background:#fff; border:1px solid #e4e7ec; border-radius:1rem; box-shadow:var(--shadow); }
    .comparison-card span { display:block; color:var(--muted); font-size:.82rem; }
    .comparison-card .comparison-label { color:#344054; font-weight:800; }
    .comparison-card strong { display:block; margin:.15rem 0; font-size:1.8rem; letter-spacing:-.04em; }
    .comparison-panel { margin-top:1rem; padding:1.25rem; background:#fff; border:1px solid #e4e7ec; border-radius:1rem; box-shadow:var(--shadow); overflow:hidden; }
    .comparison-panel-header { display:flex; justify-content:space-between; gap:1rem; align-items:end; margin-bottom:1rem; }
    .comparison-panel-header h3,.comparison-note h3 { margin:.1rem 0 0; font-size:1.2rem; letter-spacing:-.02em; }
    .comparison-select { min-width:175px; }
    .comparison-loading { color:var(--muted); padding:1rem 0; }
    .butterfly-legend { display:flex; justify-content:space-between; gap:1rem; margin-bottom:.65rem; padding:0 .5rem; color:#344054; font-size:.82rem; font-weight:800; }
    .butterfly-legend span:first-child { color:var(--violet); }
    .butterfly-legend span:last-child { color:var(--blue); }
    .butterfly-scale { display:grid; grid-template-columns:1fr 170px 1fr; gap:1rem; margin-bottom:.35rem; color:#98a2b3; font-size:.72rem; font-weight:700; }
    .butterfly-scale div:first-child { text-align:left; }
    .butterfly-scale div:nth-child(2) { text-align:center; }
    .butterfly-scale div:last-child { text-align:right; }
    .butterfly-chart { display:grid; gap:.28rem; }
    .butterfly-row { display:grid; grid-template-columns:minmax(0,1fr) 170px minmax(0,1fr); gap:1rem; align-items:center; min-height:2rem; }
    .butterfly-side { height:1.05rem; display:flex; align-items:center; }
    .butterfly-side.left { justify-content:flex-end; }
    .butterfly-side.right { justify-content:flex-start; }
    .butterfly-track { width:100%; height:1.05rem; background:#f2f4f7; overflow:hidden; }
    .butterfly-side.left .butterfly-track { display:flex; justify-content:flex-end; border-radius:.35rem 0 0 .35rem; }
    .butterfly-side.right .butterfly-track { border-radius:0 .35rem .35rem 0; }
    .butterfly-bar { height:100%; transition:width .35s ease; }
    .butterfly-bar.privacy { background:linear-gradient(90deg,#8b5cf6,#6d28d9); }
    .butterfly-bar.nhanes { background:linear-gradient(90deg,#2563eb,#60a5fa); }
    .butterfly-value { position:absolute; font-size:.72rem; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
    .butterfly-side.left .butterfly-value { right:calc(100% + .4rem); color:#6d28d9; }
    .butterfly-side.right .butterfly-value { left:calc(100% + .4rem); color:#2563eb; }
    .butterfly-center { text-align:center; color:#344054; font-size:.78rem; font-weight:750; overflow-wrap:anywhere; }
    .heatmap-wrap { overflow-x:auto; padding-bottom:.2rem; }
    .heatmap { min-width:560px; display:grid; grid-template-columns:190px repeat(2,minmax(150px,1fr)); border:1px solid #e4e7ec; border-radius:.8rem; overflow:hidden; }
    .heatmap-cell { min-height:3.2rem; padding:.65rem .7rem; border-right:1px solid rgba(255,255,255,.75); border-bottom:1px solid rgba(255,255,255,.75); display:flex; align-items:center; justify-content:center; text-align:center; font-size:.78rem; font-variant-numeric:tabular-nums; }
    .heatmap-cell.header { min-height:2.8rem; background:#f8fafc; color:#344054; font-weight:800; }
